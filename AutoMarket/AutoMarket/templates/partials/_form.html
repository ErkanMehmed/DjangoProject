<form method="post" novalidate class="app-form">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}

    {% for field in form %}
        <div class="mb-3 {% if field.errors %}has-error{% endif %}">
            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                {{ field.label }}{% if field.field.required %}<span class="text-danger"> *</span>{% endif %}
            </label>
            {{ field }}
            {% if field.help_text %}
                <div class="form-text">{{ field.help_text }}</div>
            {% endif %}
            {% for error in field.errors %}
                <div class="field-error">{{ error }}</div>
            {% endfor %}
        </div>
    {% endfor %}

    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save" }}</button>
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
